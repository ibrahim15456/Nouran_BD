<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Happy Birthday 🎉</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@300;500&display=swap" rel="stylesheet">

<style>

body {
    margin: 0;
    font-family: 'Poppins', sans-serif;
    overflow: hidden;
    background: url('photo.jpg') no-repeat center/cover;
}

/* Overlay */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.25);
}

/* 🎆 Fireworks */
#fireworks {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

/* 🎈 Balloons */
.balloon-container {
    position: fixed;
    width: 100%;
    height: 100%;
    overflow: hidden;
    pointer-events: none;
    z-index: 2;
}

.balloon {
    position: absolute;
    bottom: -200px;
    width: 70px;
    height: 90px;
    border-radius: 50%;
    opacity: 0.85;
    animation: rise linear forwards;
}

.balloon::before {
    content: "";
    position: absolute;
    width: 2px;
    height: 90px;
    background: rgba(255,255,255,0.7);
    top: 90px;
    left: 50%;
}

@keyframes rise {
    from {
        transform: translateY(0);
    }
    to {
        transform: translateY(-130vh);
    }
}

/* Intro */
#intro {
    position: fixed;
    width: 100%;
    height: 100%;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 10;
}

#intro h1 {
    font-size: 45px;
}

#intro button {
    padding: 15px 30px;
    border-radius: 25px;
    border: none;
    font-size: 18px;
    cursor: pointer;
}

/* Main */
#main {
    display: none;
    position: relative;
    height: 100vh;
    z-index: 3;
}

/* Name */
.name {
    font-family: 'Playfair Display', serif;
    font-size: 75px;
    color: white;
    text-align: center;
    margin-top: 20px;
    text-shadow: 0 5px 15px rgba(0,0,0,0.7);
}

/* 🎂 Cake */

.cake {
    position: absolute;
    left: 50%;
    top: 57%;
    transform: translateX(-50%) scale(0.9);
    z-index: 4;
    animation: cakeFloat 4s ease-in-out infinite;
}

@keyframes cakeFloat {
    0% { transform: translateX(-50%) translateY(0px); }
    50% { transform: translateX(-50%) translateY(-10px); }
    100% { transform: translateX(-50%) translateY(0px); }
}

/* Layers */

.bottom-layer,
.middle-layer,
.top-layer {

    height: 70px;
    border-radius: 20px;
    margin: auto;
    position: relative;

    box-shadow:
        0 10px 25px rgba(0,0,0,0.25);
}

.bottom-layer {
    width: 260px;
    background: #ffcad4;
}

.middle-layer {
    width: 210px;
    background: #f4acb7;
    top: -10px;
}

.top-layer {
    width: 160px;
    background: #9d8189;
    top: -20px;
}

/* Cream */

.bottom-layer::before,
.middle-layer::before,
.top-layer::before {

    content: "";
    position: absolute;

    width: 100%;
    height: 15px;

    background:
        radial-gradient(circle, white 25%, transparent 26%);

    background-size: 25px 20px;

    top: 0;
    left: 0;
}

/* Candles */

.candles {
    display: flex;
    justify-content: center;
    gap: 25px;
    position: relative;
    top: 15px;
    z-index: 10;
}

.candle {
    width: 12px;
    height: 45px;
    background: repeating-linear-gradient(
        45deg,
        #fff,
        #fff 5px,
        #ff4d6d 5px,
        #ff4d6d 10px
    );

    border-radius: 5px;
    position: relative;
}

/* Flame */

.flame {
    width: 14px;
    height: 22px;

    background: radial-gradient(circle, #ffd60a, #ff8500);

    border-radius: 50%;

    position: absolute;
    top: -22px;
    left: -1px;

    animation: flicker 0.15s infinite alternate;
}

@keyframes flicker {
    from {
        transform: translateX(-1px) scale(1);
        opacity: 0.9;
    }

    to {
        transform: translateX(1px) scale(1.08);
        opacity: 1;
    }
}

/* Floating */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-15px); }
    100% { transform: translateY(0px); }
}

/* Envelope */
.envelope {
    position: absolute;
    width: 200px;
    height: 140px;
    cursor: pointer;
    animation: float 4s ease-in-out infinite;
    box-shadow: 0 15px 30px rgba(0,0,0,0.25);
}

.env1 { top: 25%; left: 15%; background: #ffadad; }
.env2 { top: 20%; right: 15%; background: #ffd6a5; }
.env3 { bottom: 20%; left: 20%; background: #caffbf; }
.env4 { bottom: 25%; right: 20%; background: #a0c4ff; }

.envelope::before {
    content: "";
    position: absolute;
    width: 100%;
    height: 100%;
    clip-path: polygon(0 0, 100% 0, 50% 60%);
    background: rgba(255,255,255,0.75);
}

.envelope::after {
    content: "💌";
    position: absolute;
    top: 45%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 30px;
}

/* Popup bg */
.popup-bg {
    position: fixed;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.65);
    top: 0;
    left: 0;
    display: none;
    z-index: 50;
    backdrop-filter: blur(6px);
}

.popup-bg.active {
    display: block;
}

/* Popup */
.popup {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scaleY(0) scaleX(0.8);
    opacity: 0;

    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(20px);

    border: 1px solid rgba(255,255,255,0.35);

    padding: 45px;
    border-radius: 25px;

    width: 520px;
    max-width: 90%;
    min-height: 240px;

    text-align: center;
    color: white;

    font-size: 23px;
    line-height: 1.7;

    box-shadow: 0 30px 70px rgba(0,0,0,0.6);

    transition:
        transform 0.6s cubic-bezier(0.25,1.3,0.5,1),
        opacity 0.4s;

    z-index: 100;
}

.popup.active {
    transform: translate(-50%, -50%) scaleY(1) scaleX(1);
    opacity: 1;
}

.popup.closing {
    transform: translate(-50%, -50%) scaleY(0) scaleX(0.8);
    opacity: 0;
}

/* Cursor */
.cursor {
    display: inline-block;
    margin-left: 4px;
    animation: blink 1s infinite;
}

@keyframes blink {
    0%, 50%, 100% { opacity: 1; }
    25%, 75% { opacity: 0; }
}

</style>
</head>

<body>

<div class="overlay"></div>

<!-- 🎆 Fireworks -->
<canvas id="fireworks"></canvas>

<!-- 🎈 Balloons -->
<div class="balloon-container"></div>

<!-- Intro -->
<div id="intro">
    <h1>🎉 A Special Surprise 🎁</h1>
    <button onclick="start()">Open 💌</button>
</div>

<!-- Main -->
<div id="main">

<div class="name" id="name"></div>

<!-- 🎂 Cake -->
<div class="cake">
    <div class="candles">
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
    </div>

    <div class="top-layer"></div>
    <div class="middle-layer"></div>
    <div class="bottom-layer"></div>
</div>

<div class="envelope env1" onclick="openMsg(0)"></div>
<div class="envelope env2" onclick="openMsg(1)"></div>
<div class="envelope env3" onclick="openMsg(2)"></div>
<div class="envelope env4" onclick="openMsg(3)"></div>

</div>

<!-- Popup -->
<div class="popup-bg" id="popupBg" onclick="closeMsg()"></div>

<div class="popup" id="popup">
    <div id="popupText"></div>
</div>

<!-- Music -->
<audio id="music" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

<script>

/* Start */
function start() {

    document.getElementById("intro").style.display = "none";
    document.getElementById("main").style.display = "block";

    typeName();

    const music = document.getElementById("music");

    music.muted = true;
    music.play();

    setTimeout(() => {
        music.muted = false;
    }, 300);
}

/* Name typing */
const nameText = "HBD NOURAN";
let n = 0;

function typeName() {

    if (n < nameText.length) {

        document.getElementById("name").innerHTML += nameText[n];

        n++;

        setTimeout(typeName, 120);
    }
}

/* Messages */

const messages = [

[
"You are one of the kindest and most genuine people I know. I wish you a year full of happiness and success.",
"Your heart is pure, and your kindness makes everything around you brighter.",
"Every moment with you feels warm and comforting, like everything is exactly where it should be."
],

[
"Having you in my life is such a blessing. Thank you for being such a wonderful friend.",
"I truly appreciate every laugh, every talk, and every memory we share together.",
"You make life easier just by being in it, and that means more than you know."
],

[
"May your birthday be filled with joy, laughter, and unforgettable memories.",
"I hope this year brings you closer to everything you dream about.",
"You deserve days full of smiles and nights full of peace."
],

[
"You deserve all the happiness in the world. Stay amazing always.",
"Never forget how special and valuable you are to the people around you.",
"Keep shining the way you always do, the world needs that light."
]

];

let currentIndex = [0,0,0,0];
let typingInterval;

/* Typing */

function typeMessage(text) {

    let i = 0;

    const el = document.getElementById("popupText");

    clearInterval(typingInterval);

    el.innerHTML =
        '<span id="text"></span><span class="cursor">|</span>';

    const textSpan = document.getElementById("text");

    typingInterval = setInterval(() => {

        textSpan.innerHTML += text[i];

        i++;

        if (i >= text.length) {
            clearInterval(typingInterval);
        }

    }, 25);
}

/* Open */

function openMsg(i) {

    const popup = document.getElementById("popup");

    popup.classList.remove("closing");
    popup.classList.add("active");

    const msg = messages[i][currentIndex[i]];

    typeMessage(msg);

    currentIndex[i] =
        (currentIndex[i] + 1) % messages[i].length;

    document.getElementById("popupBg")
        .classList.add("active");
}

/* Close */

function closeMsg() {

    const popup = document.getElementById("popup");

    popup.classList.remove("active");
    popup.classList.add("closing");

    document.getElementById("popupBg")
        .classList.remove("active");

    clearInterval(typingInterval);
}

/* 🎈 Balloons */

const balloonContainer =
    document.querySelector(".balloon-container");

const balloonColors = [
    "#ffadad",
    "#ffd6a5",
    "#fdffb6",
    "#caffbf",
    "#9bf6ff",
    "#a0c4ff",
    "#bdb2ff",
    "#ffc6ff"
];

function createBalloon() {

    const balloon = document.createElement("div");

    balloon.classList.add("balloon");

    const size = Math.random() * 40 + 50;

    balloon.style.width = size + "px";
    balloon.style.height = size * 1.2 + "px";

    balloon.style.left =
        Math.random() * 100 + "vw";

    balloon.style.background =
        balloonColors[
            Math.floor(Math.random() * balloonColors.length)
        ];

    balloon.style.animationDuration =
        (Math.random() * 6 + 8) + "s";

    balloonContainer.appendChild(balloon);

    setTimeout(() => {
        balloon.remove();
    }, 15000);
}

setInterval(createBalloon, 900);

/* 🎆 Fireworks */

const canvas =
    document.getElementById("fireworks");

const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let particles = [];

function createFirework(x, y) {

    for(let i = 0; i < 80; i++) {

        particles.push({

            x: x,
            y: y,

            radius: Math.random() * 3 + 1,

            color:
                `hsl(${Math.random()*360},100%,70%)`,

            speedX:
                (Math.random() - 0.5) * 8,

            speedY:
                (Math.random() - 0.5) * 8,

            alpha: 1
        });
    }
}

function animateFireworks() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles.forEach((p, index) => {

        p.x += p.speedX;
        p.y += p.speedY;

        p.alpha -= 0.01;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `hsla(${Math.random()*360},100%,70%,${p.alpha})`;

        ctx.fill();

        if(p.alpha <= 0) {
            particles.splice(index,1);
        }
    });

    requestAnimationFrame(animateFireworks);
}

animateFireworks();

/* auto fireworks */

setInterval(() => {

    createFirework(
        Math.random() * canvas.width,
        Math.random() * canvas.height * 0.6
    );

}, 1800);

/* Resize */

window.addEventListener("resize", () => {

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
